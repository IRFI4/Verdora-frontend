<svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <filter id="noise">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="6"
      numOctaves="4"
      stitchTiles="stitch"
      result="texture"
    />
    <feColorMatrix
      in="texture"
      type="saturate"
      values="0"
    />
  </filter>

  <rect width="100%" height="100%" filter="url(#noise)" opacity=".55" />
</svg>