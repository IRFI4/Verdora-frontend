<svg
  viewBox="0 0 200 200"
  preserveAspectRatio="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <filter id="rough-frame" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.3 0.3"
        numOctaves="1"
        seed="8"
        result="noise"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="noise"
        scale="3"
        xChannelSelector="R"
        yChannelSelector="G"
      />
    </filter>
  </defs>

  <rect
    x="10"
    y="10"
    width="180"
    height="180"
    rx="34"
    fill="none"
    stroke="#50614A"
    stroke-width="2"
    filter="url(#rough-frame)"
  />
</svg>